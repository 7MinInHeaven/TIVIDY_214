name: TIVIDY C++ CI

on:
  push:
    branches: [ main, dev, '**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compilers and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential valgrind pkg-config libpq-dev libpqxx-dev 

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build Project
        run: cmake --build build -- -j$(nproc)

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Check Memory Leaks with Valgrind
        run: |
          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   ./build/bin/tividy_tests
