<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Progress Report</title>
	<link rel="stylesheet" href="style.css">
</head>
<body><li class="group"><details>
<summary>	<span class="name">Test Group<div class="progress-circle" style="--progress: 0;" role="progressbar" value>
	<span class="progress-value">0%</span>
	<span class="done-total">0/5</span>
</div></span>
</summary>
<ul>Test Unit Priority Low<div class="priority-color" data-value="0">Low</div>
</ul>
<ul>Test Unit Priority Normal<div class="priority-color" data-value="1">Normal</div>
</ul>
<ul>Test Unit Priority High<div class="priority-color" data-value="2">High</div>
</ul>
<ul>Test Unit Priority Urgent<div class="priority-color" data-value="3">Urgent</div>
</ul>
<ul>Test Unit Priority Overdue<div class="priority-color" data-value="3">Urgent</div>
</ul>
</details>
</li>
</body>
